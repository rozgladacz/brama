name: Validate gateway

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose model
        env:
          SZOP_DOMAIN: szop.example.invalid
          OPOS_DOMAIN: opos.example.invalid
        run: docker compose config --quiet

      - name: Validate Compose model with bind storage
        env:
          SZOP_DOMAIN: szop.example.invalid
          OPOS_DOMAIN: opos.example.invalid
          CADDY_DATA_MOUNT: /tmp/caddy-data
          CADDY_CONFIG_MOUNT: /tmp/caddy-config
        run: docker compose config --quiet

      - name: Validate bootstrap shell
        run: sh -n scripts/bootstrap.sh

      - name: Validate production Caddyfile
        run: >-
          docker run --rm
          -e SZOP_DOMAIN=szop.example.invalid
          -e OPOS_DOMAIN=opos.example.invalid
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine
          caddy validate --config /etc/caddy/Caddyfile

      - name: Validate local Caddyfile
        run: >-
          docker run --rm
          -v "$PWD/Caddyfile.local:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine
          caddy validate --config /etc/caddy/Caddyfile
